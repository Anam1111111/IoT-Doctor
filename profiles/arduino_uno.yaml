name: "Arduino UNO"
port: "/dev/cu.usbmodem11201"
baud_rate: 9600
log_pattern: '\[(\w+)\]\s(.+),\scount=(\d+)'
level_symbols:
  INFO: "⚪"
  WARN: "🟡"
  ERROR: "🔴"
metrics:
  uptime:
    source: message
    pattern: 'Uptime=(?P<value>\d+)s'
    unit: seconds
  free_memory:
    source: message
    pattern: 'FreeRAM=(?P<value>\d+)b'
    unit: bytes
